<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Nextag</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css" />
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8f8f8, #e8e4d9);
      margin: 0;
      padding: 0;
    }
    .navbar {
      padding: 15px 60px;
      background: #fff;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .navbar-brand {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #000;
    }
    .navbar-nav .nav-link {
      font-size: 14px;
      color: #000;
      font-weight: 500;
      letter-spacing: 1px;
      margin-right: 20px;
      transition: .3s;
    }
    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link.active {
      color: #c7b783;
    }
    .nav-icons i {
      cursor: pointer;
      margin-left: 15px;
      font-size: 18px;
      color: #000;
      transition: .3s;
    }
    .nav-icons i:hover {
      color: #c7b783;
    }
    .contact-header {
      text-align: center;
      padding: 50px 20px 10px;
    }
    .contact-header h2 {
      font-weight: 600;
      font-size: 36px;
      letter-spacing: 1px;
      color: #1b1b1b;
    }
    .contact-header p {
      color: #555;
      font-size: 16px;
      margin-top: 10px;
    }
    .container {
      max-width: 600px;
      margin: 40px auto 40px;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 500;
      color: #333;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: 0.3s;
    }
    input:focus, textarea:focus {
      border-color: #c7b783;
      box-shadow: 0 0 5px rgba(199,183,131,0.5);
      outline: none;
    }
    button {
      background: #c7b783;
      color: white;
      border: none;
      padding: 12px 20px;
      margin-top: 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s;
    }
    button:hover {
      background: #b7a36f;
    }
  
    .map-container {
      max-width: 900px;
      margin: 50px auto;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    footer {
      text-align: center;
      background: #0e0d0c;
      color: #fff;
      padding: 25px;
      font-size: 14px;
      letter-spacing: 1px;
    }
    @media (max-width: 768px) {
      .navbar {
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>

<div class="top-banner">Luxury fashion for every moment — <span>Explore elegance with Nextag</span></div>
  <nav class="navbar navbar-expand-lg navbar-light bg-white">
    <a class="navbar-brand" href="#">Nextag</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#brand">Brands</a></li>
        <li class="nav-item"><a class="nav-link" href="feed.html">Feedback</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-icons d-flex align-items-center position-relative">
        <a href="login.html"><i class="fas fa-user"></i></a>
        <a href="#" id="search-icon"><i class="fas fa-search"></i></a>
        <a href="#" id="cart-icon"><i class="fas fa-shopping-bag"></i></a>
      </div>
    </div>
  </nav>

  <div class="contact-header">
    <h2>Contact Us</h2>
    <p>Have a question or feedback? We’d love to hear from you. Fill out the form below and we’ll get back to you soon!</p>
  </div>

  <div class="container">
    <form action="#" method="post">
      <label>Your Name:</label>
      <input type="text" name="name" required>

      <label>Email Address:</label>
      <input type="email" name="email" required>

      <label>Subject:</label>
      <input type="text" name="subject">

      <label>Your Message:</label>
      <textarea name="message" rows="4" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>


  <div class="map-container">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d13609.483574695225!2d74.3211447!3d31.5820453!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x391904e4f1b12345%3A0x8b7e2eab11f09c3!2sLahore%2C%20Pakistan!5e0!3m2!1sen!2s!4v1699800000000!5m2!1sen!2s" 
      width="100%" 
      height="400" 
      style="border:0;" 
      allowfullscreen="" 
      loading="lazy">
    </iframe>
  </div>

  <footer>
    © 2025 Nextag. 
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.0.0-beta1/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelector("form").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Thank you for contacting us! We'll get back to you soon.");
      this.reset();
    });
  </script>
</body>
</html>
